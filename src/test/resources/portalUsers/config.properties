# ---------------------------------------------------------------
# Test configuration. Every key can be overridden by:
#   1) a JVM system property     e.g. mvn test -Dbrowser=firefox
#   2) an environment variable   e.g. CLIENT_PASSWORD (dots -> underscores, upper case)
# Do not commit real credentials; prefer environment variables in CI.
# ---------------------------------------------------------------

base.url=https://your-app.example.com/login

# chrome | firefox | edge
browser=chrome
headless=false

# Explicit wait used by every page object
timeout.seconds=15
page.load.timeout.seconds=60

client.username=client_user
client.password=changeme
agent.username=agent_user
agent.password=changeme
